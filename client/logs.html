<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetGuardian &mdash; Activity Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="ng-sidebar">
  <div class="brand"><span class="dot"></span> NetGuardian</div>
  <a href="dashboard.html">&#128202; Dashboard</a>
  <a href="devices.html">&#128225; Devices</a>
  <a href="alerts.html">&#128276; Alerts</a>
  <a href="reports.html">&#128196; Reports</a>
  <a href="logs.html" class="active">&#128220; Activity Log</a>
  <a href="settings.html">&#9881;&#65039; Settings</a>
  <hr style="border-color:rgba(255,255,255,0.1); margin: 1rem 0;">
  <a href="#" id="logoutBtn">&#8618; Sign Out</a>
</nav>

<main class="ng-main">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h4 class="mb-0" style="color:var(--ng-navy); font-weight:700;">Activity Log</h4>
      <p class="text-muted mb-0" style="font-size:0.88rem;">A complete history of scans, logins, and device actions - who did what, and when.</p>
    </div>
    <select class="form-select" style="width:auto;" id="actionFilter">
      <option value="">All Activity</option>
      <option value="login">Logins</option>
      <option value="scan_started">Scan Started</option>
      <option value="scan_completed">Scan Completed</option>
      <option value="device_added">Device Added</option>
      <option value="device_updated">Device Updated</option>
      <option value="device_removed">Device Removed</option>
      <option value="device_authorized">Device Authorized</option>
      <option value="device_blocked">Device Blocked</option>
      <option value="alert_generated">Alert Generated</option>
    </select>
  </div>

  <div class="ng-card">
    <div class="table-responsive">
      <table class="table ng-table align-middle">
        <thead>
          <tr>
            <th>Action</th>
            <th>Details</th>
            <th>Device</th>
            <th>User</th>
            <th>When</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="5" class="text-center text-muted py-4">Loading activity...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <span class="text-muted" style="font-size:0.82rem;" id="pageInfo"></span>
    <div class="btn-group">
      <button class="btn btn-sm btn-outline-secondary" id="prevPageBtn">&larr; Previous</button>
      <button class="btn btn-sm btn-outline-secondary" id="nextPageBtn">Next &rarr;</button>
    </div>
  </div>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/logs.js"></script>
</body>
</html>

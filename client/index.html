<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetGuardian &mdash; Sign In</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="ng-auth-wrap">
  <div class="ng-auth-card">
    <div class="brand"><span class="dot">&#9679;</span> NetGuardian</div>
    <p class="text-muted mb-4" style="font-size:0.9rem;">Network monitoring &amp; access control</p>

    <ul class="nav nav-pills mb-3" id="authTabs">
      <li class="nav-item flex-fill">
        <button class="nav-link active w-100" id="loginTabBtn" onclick="showTab('login')">Sign In</button>
      </li>
      <li class="nav-item flex-fill">
        <button class="nav-link w-100" id="registerTabBtn" onclick="showTab('register')">Register</button>
      </li>
    </ul>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="loginEmail" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-ng-navy w-100" id="loginBtn">Sign In</button>
      <p class="text-center mt-2 mb-0">
        <a href="forgot-password.html" style="font-size:0.82rem; color:var(--ng-muted);">Forgot your password?</a>
      </p>
    </form>

    <form id="registerForm" class="d-none">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="registerName" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Organization / Network Name</label>
        <input type="text" class="form-control" id="registerOrgName" placeholder="e.g. Acme Corp" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="registerEmail" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="registerPassword" minlength="8" required>
        <div class="form-text" style="font-size:0.76rem;">At least 8 characters, with uppercase, lowercase, a number, and a special character.</div>
      </div>
      <button type="submit" class="btn btn-ng-gold w-100" id="registerBtn">Create Account</button>
      <p class="text-muted mt-2 mb-0" style="font-size:0.78rem;">The first account created becomes the system admin.</p>
    </form>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  function showTab(tab) {
    document.getElementById('loginForm').classList.toggle('d-none', tab !== 'login');
    document.getElementById('registerForm').classList.toggle('d-none', tab !== 'register');
    document.getElementById('loginTabBtn').classList.toggle('active', tab === 'login');
    document.getElementById('registerTabBtn').classList.toggle('active', tab === 'register');
    document.getElementById('alertBox').classList.add('d-none');
  }

  function showError(message) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.classList.remove('d-none');
  }

  // Redirect straight to dashboard if already logged in
  if (getToken()) window.location.href = 'dashboard.html';

  // If we landed here because auth.js auto-logged the person out due to
  // inactivity, show a clear reason instead of a silent, confusing logout.
  if (sessionStorage.getItem('ng_idle_logout')) {
    sessionStorage.removeItem('ng_idle_logout');
    showError('You were signed out after a period of inactivity. Please sign in again.');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Signing in...';

    try {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { token, user } = await NetGuardianAPI.login(email, password);
      setSession(token, user);
      window.location.href = 'dashboard.html';
      // Intentionally leave the button disabled/spinning here - we're
      // navigating away momentarily, so re-enabling it would just cause
      // a visible flicker back to normal right before the page changes.
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Creating account...';

    try {
      const name = document.getElementById('registerName').value;
      const organizationName = document.getElementById('registerOrgName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const { token, user } = await NetGuardianAPI.register(name, organizationName, email, password);
      setSession(token, user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetGuardian &mdash; Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="ng-auth-wrap">
  <div class="ng-auth-card">
    <div class="brand"><span class="dot">&#9679;</span> NetGuardian</div>
    <p class="text-muted mb-4" style="font-size:0.9rem;">Reset your password</p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <div id="successBox" class="alert alert-success d-none" role="alert"></div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
        <div class="form-text">We'll send a reset link to this address if an account exists.</div>
      </div>
      <button type="submit" class="btn btn-ng-navy w-100">Send Reset Link</button>
    </form>

    <p class="text-center mt-3 mb-0">
      <a href="index.html" style="font-size:0.85rem; color:var(--ng-muted);">&larr; Back to sign in</a>
    </p>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  function showError(message) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.classList.remove('d-none');
    document.getElementById('successBox').classList.add('d-none');
  }

  function showSuccess(message) {
    const box = document.getElementById('successBox');
    box.textContent = message;
    box.classList.remove('d-none');
    document.getElementById('alertBox').classList.add('d-none');
  }

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const result = await NetGuardianAPI.forgotPassword(email);
      showSuccess(result.message);
      e.target.reset();
    } catch (err) {
      showError(err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>

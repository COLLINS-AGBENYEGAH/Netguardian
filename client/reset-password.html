<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetGuardian &mdash; Reset Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="ng-auth-wrap">
  <div class="ng-auth-card">
    <div class="brand"><span class="dot">&#9679;</span> NetGuardian</div>
    <p class="text-muted mb-4" style="font-size:0.9rem;">Set a new password</p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <div id="successBox" class="alert alert-success d-none" role="alert"></div>
    <div id="invalidLinkBox" class="alert alert-warning d-none" role="alert">
      This reset link is missing required information. Please request a new one from the
      <a href="forgot-password.html">forgot password</a> page.
    </div>

    <form id="resetForm">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="password" minlength="8" required>
        <div class="form-text">At least 8 characters, with uppercase, lowercase, a number, and a special character.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-ng-navy w-100">Reset Password</button>
    </form>

    <p class="text-center mt-3 mb-0">
      <a href="index.html" style="font-size:0.85rem; color:var(--ng-muted);">&larr; Back to sign in</a>
    </p>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  function showError(message) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.classList.remove('d-none');
    document.getElementById('successBox').classList.add('d-none');
  }

  function showSuccess(message) {
    const box = document.getElementById('successBox');
    box.textContent = message;
    box.classList.remove('d-none');
    document.getElementById('alertBox').classList.add('d-none');
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const email = params.get('email');

  if (!token || !email) {
    document.getElementById('resetForm').classList.add('d-none');
    document.getElementById('invalidLinkBox').classList.remove('d-none');
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const result = await NetGuardianAPI.resetPassword(email, token, password);
      showSuccess(`${result.message} Redirecting to sign in...`);
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
